    cache_dir: /Users/tobe/.cache/huggingface/hub/models--facebook--sam2-hiera-small
    snapshot: /Users/tobe/.cache/huggingface/hub/models--facebook--sam2-hiera-small/snapshots/e080ada8afd19df5e165abe71b006edc7f4c3d4e
    download:
      command: hf download facebook/sam2-hiera-small --include "*.json" --include "*.safetensors" --include "*.yaml" --max-workers 1
      notes: Small variant installed first because sam2-hiera-large stalled anonymously.
    required_files:
      - config.json
      - model.safetensors
      - preprocessor_config.json
      - processor_config.json
      - sam2_hiera_s.yaml

