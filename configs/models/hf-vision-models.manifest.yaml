id: hf-vision-models
updated_at: 2026-05-22
cache_root: /Users/tobe/.cache/huggingface/hub
policy:
  - Hugging Face cache is the source of local model files.
  - Project directories should record manifests and tests, not copy model weights.
  - Large downloads may be partial when unauthenticated HF requests stall; rerun `hf download` to resume.
models:
  - id: florence-2-base
    repo: microsoft/Florence-2-base
    kind: vision_foundation_model
    purpose: caption, object detection, grounding, bbox-oriented structured vision probe
    license: mit
    status: downloaded
    revision: 5ca5edf5bd017b9919c05d08aebef5e4c7ac3bac
    cache_dir: /Users/tobe/.cache/huggingface/hub/models--microsoft--Florence-2-base
    snapshot: /Users/tobe/.cache/huggingface/hub/models--microsoft--Florence-2-base/snapshots/5ca5edf5bd017b9919c05d08aebef5e4c7ac3bac
    download:
      command: hf download microsoft/Florence-2-base --exclude "*.bin" --max-workers 4
      notes: Excluded pytorch_model.bin to avoid duplicate weights; safetensors is present.
    required_files:
      - config.json
      - model.safetensors
      - preprocessor_config.json
      - processing_florence2.py
      - tokenizer.json

  - id: sam2-hiera-small
    repo: facebook/sam2-hiera-small
    kind: segmentation_model
    purpose: promptable mask generation fallback for difficult sprite cutouts
    license: apache-2.0
    status: downloaded
