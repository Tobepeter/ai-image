        - HF_XET_HIGH_PERFORMANCE=1 hf download Qwen/Qwen2.5-VL-3B-Instruct --max-workers 2
        - HF_HUB_DISABLE_XET=1 hf download Qwen/Qwen2.5-VL-3B-Instruct model-00001-of-00002.safetensors --max-workers 1
