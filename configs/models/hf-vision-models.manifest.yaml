  - id: rembg-models
    repo: null
    kind: background_removal_model_set
    purpose: rembg-managed background removal models such as u2netp and isnet-general-use
    status: tested
    local_cache:
      u2netp:
        path: /Users/tobe/.u2net/u2netp.onnx
        size: 4.4M
        sha256: 309c8469258dda742793dce0ebea8e6dd393174f89934733ecc8b14c76f4ddd8
    test:
      case_id: item-sheet
      command: rembg i -m u2netp input.png output.alpha.png
      output: data/outputs/assets/sprite-postprocess/item-sheet/runs/rembg/transparent/pixel-item-sprite-sheet.alpha.png
      preview: data/outputs/assets/sprite-postprocess/item-sheet/runs/rembg/pixel-item-sprite-sheet.checker-preview.png
      elapsed_seconds: 6.47
    notes:
      - rembg downloads its own models by model name when invoked; these are not all handled as normal HF repo snapshots.
      - u2netp is installed through rembg's managed cache, not Hugging Face cache.
      - On the generated pixel item sheet, u2netp removed the background but visibly desaturated/softened the pixel-art assets, so keep it as a fallback for difficult backgrounds rather than the primary path.
